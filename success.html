<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — Juriah Monique Adornments</title>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 55% at 50% 0%,#F3D9DF,transparent 70%),#FAF3EA;font-family:'Jost',sans-serif;color:#6B5040;text-align:center;padding:24px;}
  .card{max-width:480px;background:#fff;border:1px solid #E0C384;border-radius:26px;padding:52px 36px;}
  h1{font-family:'Allura',cursive;font-weight:400;font-size:3.4rem;color:#C06D85;margin:0;line-height:1;}
  h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.5rem;margin:14px 0 0;}
  p{font-size:.95rem;line-height:1.7;opacity:.85;margin:16px 0 0;}
  a{display:inline-block;margin-top:28px;background:#C06D85;color:#fff;text-decoration:none;padding:14px 30px;border-radius:999px;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;}
</style>
</head>
<body>
  <div class="card">
    <h1>Thank you</h1>
    <h2>Your order is confirmed ♡</h2>
    <p>A receipt is on its way to your email. Each piece is made by hand, so we'll be in touch about shipping soon.</p>
    <a href="index.html">Keep browsing</a>
  </div>
  <script>try{localStorage.removeItem('jd_cart');}catch(e){}</script>

</html>
